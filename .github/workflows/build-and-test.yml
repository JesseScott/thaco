name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: THACO/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: THACO

      - name: Build project
        run: npm run build
        working-directory: THACO

      - name: Run tests
        run: npm test
        working-directory: THACO

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: THACO

      - name: Run UI tests
        run: npm run test:ui
        working-directory: THACO
        env:
          CI: 'true'

  # Publishes to GitHub Pages once the build and tests above have passed.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: THACO/package-lock.json

      - run: npm ci
        working-directory: THACO

      - id: pages
        uses: actions/configure-pages@v5

      # SITE_URL makes the build write absolute URLs into the Owlbear manifest
      - run: npm run build
        working-directory: THACO
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: THACO/dist

      - id: deployment
        uses: actions/deploy-pages@v4
