name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: THACO

      - name: Build project
        run: npm run build
        working-directory: THACO

      - name: Run tests
        run: npm test
        working-directory: THACO

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: THACO

      - name: Run UI tests
        run: npm run test:ui
        working-directory: THACO
        env:
          CI: 'true'
