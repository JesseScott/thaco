version: 2
updates:
  - package-ecosystem: npm
    directory: /THACO
    assignees:
      - JesseScott
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    assignees:
      - JesseScott
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
